name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [{cc: gcc, cxx: g++}, {cc: clang, cxx: clang++}]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Debug + sanitizers)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVIGIL_SANITIZE=ON
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - name: Build firmware (once the CubeMX project exists)
        run: |
          if [ ! -f firmware/CMakePresets.json ]; then echo "no firmware project yet, skipping"; exit 0; fi
          cd firmware
          cmake --preset Debug
          cmake --build --preset Debug
